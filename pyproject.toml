[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isaric"
version = "0.1.0"
description = "Modular package for implementing the RAPID methodology: reproducible analytics for predictive modeling, inference, and data preprocessing in clinical research"
dependencies = [
    # Data manipulation
    "pandas==2.3.3",
    "numpy==2.3.5",
    "openpyxl==3.1.5",
    "formulaic==1.2.1",

    # Modeling and machine learning
    "scikit-learn==1.5.2",
    "lifelines==0.30.0",
    "statsmodels==0.14.5",
    "stepmix==2.0.0",

    # Tree-based models
    "xgboost==2.1.1",
    "lightgbm==4.5.0",
    "catboost==1.2.10",

    # Imbalanced learning
    "imbalanced-learn==0.12.3",

    # Visualization
    "matplotlib==3.10.7",
    "seaborn==0.13.2",
    "upsetplot==0.9.0",
    "plotly==5.16.0",

    # Model interpretability
    "shap==0.46.0",
]

authors = [
    { name = "ISARIC HUB SA" }
]
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "nbformat==5.10.4",
    "setuptools==80.9.0",
    "build==1.3.0",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true