[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isaric"
version = "0.1.0"
description = "Modular package for implementing the RAPID methodology: reproducible analytics for predictive modeling, inference, and data preprocessing in clinical research"
dependencies = [
    # Data manipulation
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.0",
    "formulaic>=1.0",

    # Modeling and machine learning
    "scikit-learn>=1.5",
    "lifelines>=0.29",
    "statsmodels>=0.14",
    "stepmix>=2.0",

    # Tree-based models
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2.10",

    # Imbalanced learning
    "imbalanced-learn>=0.12",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "upsetplot>=0.9",
    "plotly>=5.18",
    "kaleido>=0.2.1",

    # Model interpretability
    "shap>=0.44",
]

authors = [
    { name = "ISARIC HUB SA" }
]
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "nbformat>=5.10",
    "setuptools>=80.0",
    "build>=1.3",
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true